<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>歌詞ビンゴ</title>
<meta name="description" content="カラオケで、歌詞に出てきた言葉をタップして遊ぶ 5×5 のビンゴ">
<meta name="theme-color" content="#130e26">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="歌詞ビンゴ">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;800&family=Zen+Kaku+Gothic+New:wght@500;700&display=swap" media="print" onload="this.media='all'">
<style>
/* レイアウト: 1画面のゲーム。見出し → 状態（4枠）→ 残りの高さいっぱいの正方形カード → 操作。ネオンのカラオケボックス */
:root {
  --bg: #130e26;
  --bg-glow: #3a1d6e;
  --surface: #1e1740;
  --surface-on: #3a1840;
  --line: #3d3278;
  --fg: #f4f0ff;
  --muted: #b3aad8;
  --pink: #ff4fa3;
  --cyan: #3ee6ff;
  --yellow: #ffd84a;
  --on-accent: #130e26;
  --display: "M PLUS Rounded 1c", "Hiragino Maru Gothic ProN", "Noto Sans JP", sans-serif;
  --body: "Zen Kaku Gothic New", "Hiragino Sans", "Noto Sans JP", "Yu Gothic", sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg) radial-gradient(120% 50% at 50% -8%, var(--bg-glow) 0%, transparent 60%) no-repeat;
  color: var(--fg);
  font-family: var(--body);
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
  overscroll-behavior: none;
}
.app {
  max-width: 520px; margin: 0 auto; min-height: 100%;
  padding-top: calc(10px + env(safe-area-inset-top, 0px));
  padding-bottom: calc(12px + env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; flex-direction: column; gap: 10px;
}
body.playing .app { height: 100dvh; min-height: 0; }
header { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
h1 {
  margin: 0; font: 800 1.55rem var(--display); letter-spacing: .04em; color: #fff; white-space: nowrap;
  text-shadow: 0 0 6px var(--pink), 0 0 18px var(--pink);
}
h1 span { color: var(--cyan); text-shadow: 0 0 6px var(--cyan), 0 0 18px var(--cyan); }
.tabs { display: flex; background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 3px; }
.tabs button {
  min-height: 44px; min-width: 62px; border: 0; background: transparent; color: var(--muted);
  font: 700 .9rem var(--body); padding: 0 12px; border-radius: 999px; cursor: pointer;
}
.tabs button[aria-selected="true"] { background: var(--line); color: #fff; }

/* あそぶ画面 */
#view-play { display: flex; flex-direction: column; gap: 10px; flex: 1; min-height: 0; }
.status { display: grid; grid-template-columns: 1fr 1fr 1fr 1.15fr; gap: 6px; }
.pill {
  background: var(--surface); border: 1px solid var(--line); border-radius: 14px; color: var(--fg);
  padding: 5px 2px; text-align: center; min-width: 0; font-family: var(--body);
}
.pill b { display: block; font: 800 1.45rem/1.15 var(--display); font-variant-numeric: tabular-nums; }
.pill small { display: block; color: var(--muted); font-size: .7rem; white-space: nowrap; overflow: hidden; }
@media (max-width: 360px) { .pill small { font-size: .62rem; letter-spacing: -.02em; } }
.pill.reach.hot b { color: var(--yellow); text-shadow: 0 0 10px var(--yellow); }
.pill.bingo.hot b { color: var(--pink); text-shadow: 0 0 10px var(--pink); }
button.pill.rule { cursor: pointer; border-color: var(--cyan); box-shadow: inset 0 0 10px rgba(62, 230, 255, .18); }
button.pill.rule b { font-size: 1.05rem; line-height: 1.55; color: var(--cyan); }
button.pill.rule:focus-visible { outline: 3px solid var(--cyan); outline-offset: 2px; }

.board-area { flex: 1; min-height: 0; container-type: size; display: flex; align-items: flex-start; justify-content: center; }
.board-wrap { position: relative; width: min(100cqw, 100cqh); aspect-ratio: 1; max-width: 100%; }
.board { display: grid; grid-template-columns: repeat(5, 1fr); grid-template-rows: repeat(5, 1fr); gap: 5px; width: 100%; height: 100%; }
.cell {
  position: relative; border: 1.5px solid var(--line); background: var(--surface); color: var(--fg);
  border-radius: 10px; padding: 2px; cursor: pointer; user-select: none; -webkit-user-select: none; min-width: 0; min-height: 0;
  display: flex; align-items: center; justify-content: center; text-align: center; overflow: hidden;
  font: 700 max(12px, min(4.1vw, 3.6cqmin, 1.1rem))/1.15 var(--body);
  transition: transform .08s, background .15s, border-color .15s;
}
.cell .w { position: relative; z-index: 1; overflow-wrap: anywhere; }
.cell.long { font-size: max(12px, min(3.3vw, 3cqmin, .92rem)); }
.cell:active { transform: scale(.92); }
.cell:focus-visible { outline: 3px solid var(--cyan); outline-offset: 1px; }
.cell::before {
  content: ""; position: absolute; inset: 9%; border-radius: 50%;
  border: 2.5px solid var(--pink); background: rgba(255, 79, 163, .16);
  transform: scale(0) rotate(-20deg); opacity: 0;
  transition: transform .18s cubic-bezier(.3, 1.6, .6, 1), opacity .12s;
}
.cell.on { border-color: var(--pink); background: var(--surface-on); box-shadow: 0 0 10px rgba(255, 79, 163, .5); }
.cell.on::before { transform: scale(1) rotate(-8deg); opacity: 1; }
.cell.line { border-color: var(--cyan); box-shadow: 0 0 12px rgba(62, 230, 255, .65), inset 0 0 10px rgba(62, 230, 255, .3); }
.cell.line::before { border-color: var(--cyan); background: rgba(62, 230, 255, .14); box-shadow: 0 0 0 3px var(--surface-on), 0 0 0 5.5px var(--cyan); inset: 14%; }
.cell.target { border: 2px dashed var(--yellow); }
.cell.free { color: var(--cyan); font-family: var(--display); font-weight: 800; text-shadow: 0 0 8px var(--cyan); cursor: default; }
.cell.free:active { transform: none; }
/* 戻したマスを光らせる */
.cell.undone { animation: undone .55s ease-out; }
@keyframes undone { 0% { background: #fff; color: var(--on-accent); box-shadow: 0 0 22px #fff; } 100% { } }

.toast {
  position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%) scale(.6); z-index: 5;
  background: var(--yellow); color: var(--on-accent); font: 800 2rem var(--display);
  padding: 10px 26px; border-radius: 16px; opacity: 0; pointer-events: none; white-space: nowrap;
  box-shadow: 0 0 24px rgba(255, 216, 74, .7);
  transition: opacity .15s, transform .22s cubic-bezier(.3, 1.6, .6, 1);
}
.toast.info { background: var(--cyan); font: 700 1.05rem var(--body); padding: 12px 20px; box-shadow: 0 0 24px rgba(62, 230, 255, .6); }
.toast.show { opacity: 1; transform: translate(-50%, -50%) scale(1); }

.actions { display: flex; gap: 8px; }
.btn {
  min-height: 48px; border-radius: 14px; padding: 8px 12px; cursor: pointer;
  font: 700 1rem var(--body); color: var(--fg); background: var(--surface); border: 1.5px solid var(--line);
}
.btn:focus-visible { outline: 3px solid var(--cyan); outline-offset: 2px; }
.btn.pink { background: var(--pink); border-color: var(--pink); color: var(--on-accent); box-shadow: 0 0 16px rgba(255, 79, 163, .55); }
.btn.armed { background: var(--yellow); border-color: var(--yellow); color: var(--on-accent); }
.btn:disabled { opacity: .4; cursor: default; }
#btn-undo { flex: 0 0 34%; }
#btn-new { flex: 1; white-space: nowrap; }
.hint { color: var(--muted); font-size: .78rem; line-height: 1.55; margin: 0; }
.hint b { color: var(--fg); }

/* ビンゴのオーバーレイ */
.overlay {
  position: fixed; inset: 0; z-index: 20; background: rgba(10, 6, 24, .78);
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  padding: 24px max(24px, env(safe-area-inset-right, 0px)) calc(24px + env(safe-area-inset-bottom, 0px)) max(24px, env(safe-area-inset-left, 0px));
  animation: fade .2s;
}
.overlay .inner { width: 100%; max-width: 360px; display: flex; flex-direction: column; gap: 12px; align-items: center; }
.big { font: 800 clamp(3rem, 16vw, 4.2rem) var(--display); color: #fff; text-shadow: 0 0 8px var(--pink), 0 0 24px var(--pink), 0 0 48px var(--pink); animation: pop .35s cubic-bezier(.3, 1.6, .6, 1); }
.sub { color: var(--cyan); font-weight: 700; font-size: 1.05rem; margin-bottom: 18px; }
.overlay .btn { width: 100%; }
@keyframes fade { from { opacity: 0; } }
@keyframes pop { from { transform: scale(.5); opacity: 0; } }

/* ルールのシート */
.sheet-back { position: fixed; inset: 0; z-index: 30; background: rgba(10, 6, 24, .7); display: flex; align-items: flex-end; justify-content: center; animation: fade .15s; }
.sheet {
  width: 100%; max-width: 520px; max-height: 92dvh; overflow-y: auto;
  background: var(--surface); border: 1px solid var(--line); border-bottom: 0; border-radius: 22px 22px 0 0;
  padding: 18px max(18px, env(safe-area-inset-right, 0px)) calc(18px + env(safe-area-inset-bottom, 0px)) max(18px, env(safe-area-inset-left, 0px));
  display: flex; flex-direction: column; gap: 12px; animation: up .22s ease-out;
}
@keyframes up { from { transform: translateY(40px); opacity: 0; } }
.sheet h2 { margin: 0; font: 800 1.2rem var(--display); }
.seg { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; background: var(--bg); border: 1px solid var(--line); border-radius: 14px; padding: 4px; }
.seg button { min-height: 48px; border: 0; border-radius: 10px; background: transparent; color: var(--muted); font: 700 1rem var(--body); cursor: pointer; }
.seg button[aria-checked="true"] { background: var(--cyan); color: var(--on-accent); }
.seg button:focus-visible { outline: 3px solid var(--cyan); outline-offset: 1px; }
.rules { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.rules li { display: grid; grid-template-columns: 2.2em 1fr; gap: 8px; align-items: start; padding: 9px 10px; border-radius: 12px; background: var(--bg); border: 1px solid var(--line); }
.rules li.diff { border-color: var(--yellow); box-shadow: inset 0 0 0 1px var(--yellow); }
.rules .mk { font: 800 1.25rem/1.2 var(--display); text-align: center; }
.rules .mk.ok { color: var(--cyan); }
.rules .mk.ng { color: var(--pink); }
.rules .t { font-size: .92rem; line-height: 1.5; }
.rules .t b { display: block; font-size: .78rem; color: var(--muted); font-weight: 700; }
.rules .t em { font-style: normal; color: var(--yellow); font-size: .75rem; font-weight: 700; margin-left: 6px; }
.sheet h3 { margin: 4px 0 0; font-size: .85rem; color: var(--muted); }
.common { margin: 0; padding-left: 1.2em; font-size: .9rem; line-height: 1.7; }

/* ことば画面 */
#view-words { display: flex; flex-direction: column; gap: 10px; }
textarea {
  width: 100%; min-height: 46dvh; border: 1.5px solid var(--line); border-radius: 14px; resize: vertical;
  background: var(--surface); color: var(--fg); font: 1rem/1.8 var(--body); padding: 10px 12px;
}
textarea:focus-visible { outline: 3px solid var(--cyan); outline-offset: 1px; }
.count { font-size: .85rem; color: var(--cyan); font-variant-numeric: tabular-nums; }
.count.bad { color: var(--yellow); font-weight: 700; }
.row { display: flex; gap: 8px; }
.row .btn { flex: 1; }

@media (prefers-reduced-motion: reduce) {
  *, *::before { transition: none !important; animation: none !important; }
}
</style>
</head>
<body class="playing">
<div class="app">
  <header>
    <h1>歌詞<span>ビンゴ</span></h1>
    <div class="tabs" role="tablist">
      <button id="tab-play" role="tab" aria-selected="true" aria-controls="view-play">あそぶ</button>
      <button id="tab-words" role="tab" aria-selected="false" aria-controls="view-words">ことば</button>
    </div>
  </header>

  <section id="view-play" role="tabpanel">
    <div class="status">
      <div class="pill bingo" id="pill-bingo"><b id="n-bingo">0</b><small>ビンゴ</small></div>
      <div class="pill reach" id="pill-reach"><b id="n-reach">0</b><small>リーチ</small></div>
      <div class="pill"><b id="n-marked">1</b><small>/25 FREE込み</small></div>
      <button class="pill rule" id="btn-rule" aria-haspopup="dialog"><b id="rule-name">ふつう</b><small>ルール ▸</small></button>
    </div>
    <div class="board-area">
      <div class="board-wrap">
        <div class="board" id="board" aria-label="ビンゴカード"></div>
        <div class="toast" id="toast" aria-live="polite"></div>
      </div>
    </div>
    <div class="actions">
      <button class="btn" id="btn-undo" disabled>↶ 戻す</button>
      <button class="btn" id="btn-new">新しいカード</button>
    </div>
    <p class="hint">歌詞にマスの言葉が出たらタップ。もう一度タップで取り消し。</p>
  </section>

  <section id="view-words" role="tabpanel" hidden>
    <p class="hint">カードに使う言葉を1行に1つ。24個以上の中から、ランダムにカードを作ります。</p>
    <textarea id="words" spellcheck="false" aria-label="カードに使う言葉"></textarea>
    <div class="count" id="word-count" aria-live="polite"></div>
    <div class="row">
      <button class="btn" id="btn-reset-words">最初に戻す</button>
      <button class="btn pink" id="btn-save-words">保存して作り直す</button>
    </div>
  </section>
</div>

<div class="overlay" id="overlay" role="dialog" aria-modal="true" aria-labelledby="ov-title" hidden>
  <div class="inner">
    <div class="big" id="ov-title">BINGO!</div>
    <div class="sub" id="ov-sub">1列そろいました</div>
    <button class="btn pink" id="ov-continue">このまま続ける</button>
    <button class="btn" id="ov-new">新しいカード</button>
  </div>
</div>

<div class="sheet-back" id="sheet" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
    <h2 id="sheet-title">言葉の数え方</h2>
    <div class="seg" role="radiogroup" aria-label="ルール">
      <button role="radio" data-rule="loose" aria-checked="false">ゆるめ</button>
      <button role="radio" data-rule="normal" aria-checked="true">ふつう</button>
      <button role="radio" data-rule="strict" aria-checked="false">きびしめ</button>
    </div>
    <ul class="rules" id="rule-list"></ul>
    <h3>どのルールでも同じ</h3>
    <ul class="common">
      <li>意味が同じ別の言葉はダメ（君 ≠ あなた）</li>
      <li>数えるのは画面に出た歌詞だけ。自分が歌った曲は数えない</li>
      <li>迷ったら、歌っている人が決める</li>
    </ul>
    <button class="btn" id="sheet-close">閉じる</button>
  </div>
</div>

<script>
"use strict";
const OLD_DEFAULT_WORDS_V1 = ["君","僕","愛","夢","空","涙","笑顔","未来","明日","星","光","風","心","世界","約束","奇跡","永遠","季節","桜","夜","月","雨","海","花","声","名前","記憶","思い出","さよなら","ありがとう","好き","一緒","運命","自由","希望","勇気","翼","扉","道","旅","景色","瞳","胸","痛み","嘘","青春","恋","秘密","幸せ","最後","今日","昨日","夏","冬","太陽","虹","神様","魔法","宇宙","鼓動","信じる","守る","輝く","叶う","届く","走る","抱きしめる","泣く","忘れない","ふたり","友","俺","Baby","Oh","Yeah","ラララ"];
const DEFAULT_WORDS = ["君","僕","愛","夢","空","涙","笑顔","未来","明日","星","光","風","心","世界","約束","奇跡","永遠","季節","桜","夜","月","雨","海","花","声","名前","記憶","思い出","さよなら","ありがとう","好き","一緒","運命","自由","希望","勇気","翼","扉","道","旅","景色","瞳","胸","痛み","嘘","青春","恋","秘密","幸せ","最後","今日","昨日","夏","冬","太陽","虹","神様","魔法","宇宙","鼓動","手","雲","街","朝","春","秋","物語","花火","地図","ふたり","友","俺","Baby","Oh","Yeah","ラララ"].join("\n");
const KEY = "lyric-bingo-v2";
const FREE = 12;
const HISTORY_MAX = 100;
const LINES = (() => {
  const L = [];
  for (let r = 0; r < 5; r++) L.push([0, 1, 2, 3, 4].map(c => r * 5 + c));
  for (let c = 0; c < 5; c++) L.push([0, 1, 2, 3, 4].map(r => r * 5 + c));
  L.push([0, 6, 12, 18, 24], [4, 8, 12, 16, 20]);
  return L;
})();
const RULES = {
  loose:  { name: "ゆるめ",   rows: [["書き方", "ok", "君 ＝ きみ ＝ キミ（読みが同じならOK）"], ["形の変化", "ok", "輝く → 輝いて もOK"], ["長い言葉の一部", "ok", "夜 → 夜空 もOK（入っていればOK）"]] },
  normal: { name: "ふつう",   rows: [["書き方", "ok", "君 ＝ きみ ＝ キミ（読みが同じならOK）"], ["形の変化", "ng", "輝く ≠ 輝いて（形が変わったらダメ）"], ["長い言葉の一部", "ok", "星 → 流れ星 はOK。夜 → 夜空 はダメ（読みが変わる）"]] },
  strict: { name: "きびしめ", rows: [["書き方", "ng", "君 ≠ きみ（画面の歌詞と同じ書き方だけOK）"], ["形の変化", "ng", "輝く ≠ 輝いて（形が変わったらダメ）"], ["長い言葉の一部", "ok", "星 → 流れ星 はOK。夜 → 夜空 はダメ（読みが変わる）"]] }
};

// ---- 状態 ----
function parseWords(text) {
  const seen = new Set();
  return String(text).split(/\r?\n/).map(s => s.trim()).filter(s => s && !seen.has(s) && seen.add(s));
}
function sameList(a, b) { return a.length === b.length && a.every((w, i) => w === b[i]); }
function shuffle(a) {
  a = a.slice();
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}
function makeCard(words) {
  const pick = shuffle(parseWords(words)).slice(0, 24);
  pick.splice(FREE, 0, "FREE");
  return { card: pick, marks: pick.map((_, i) => i === FREE) };
}
function validCard(c) {
  return c && Array.isArray(c.card) && c.card.length === 25 && c.card.every(w => typeof w === "string") &&
    Array.isArray(c.marks) && c.marks.length === 25 && c.marks.every(m => typeof m === "boolean") && c.marks[FREE] === true;
}
function loadState() {
  let s = null;
  try { s = JSON.parse(localStorage.getItem(KEY)); } catch (e) { s = null; }
  if (!s || typeof s !== "object") s = {};
  let words = typeof s.words === "string" && parseWords(s.words).length >= 24 ? s.words : DEFAULT_WORDS;
  if (sameList(parseWords(words), OLD_DEFAULT_WORDS_V1)) words = DEFAULT_WORDS; // 第1版の標準のままなら新しい標準へ
  const base = validCard(s) ? { card: s.card, marks: s.marks } : makeCard(words);
  const history = Array.isArray(s.history) ? s.history.filter(validCard).map(h => ({ card: h.card, marks: h.marks })).slice(-HISTORY_MAX) : [];
  const rule = RULES[s.rule] ? s.rule : "normal";
  return { words, card: base.card, marks: base.marks, ackBingo: 0, history, rule };
}
function saveState() {
  try { localStorage.setItem(KEY, JSON.stringify(state)); }
  catch (e) {
    // 容量が足りないときは、古い履歴を減らしてもう一度
    try { state.history = state.history.slice(-20); localStorage.setItem(KEY, JSON.stringify(state)); } catch (e2) {}
  }
}
function evaluate(marks) {
  const done = LINES.filter(l => l.every(i => marks[i]));
  const reachLines = LINES.filter(l => l.filter(i => marks[i]).length === 4);
  const targets = new Set(reachLines.map(l => l.find(i => !marks[i])));
  return { bingo: done.length, reach: reachLines.length, onLine: new Set(done.flat()), targets };
}

let state = loadState();
state.ackBingo = evaluate(state.marks).bingo; // 開き直したときにオーバーレイを出し直さない
saveState();

// ---- 表示 ----
const $ = id => document.getElementById(id);
const board = $("board");
const cells = [];
for (let i = 0; i < 25; i++) {
  const b = document.createElement("button");
  b.className = "cell";
  b.id = "cell-" + i;
  const s = document.createElement("span");
  s.className = "w";
  b.appendChild(s);
  b.addEventListener("click", () => toggle(i));
  board.appendChild(b);
  cells.push(b);
}

function render() {
  const ev = evaluate(state.marks);
  cells.forEach((b, i) => {
    const w = state.card[i];
    b.firstChild.textContent = w;
    b.classList.toggle("on", state.marks[i]);
    b.classList.toggle("line", ev.onLine.has(i));
    b.classList.toggle("target", ev.targets.has(i));
    b.classList.toggle("free", i === FREE);
    b.classList.toggle("long", [...w].length >= 4);
    b.setAttribute("aria-pressed", String(state.marks[i]));
    b.setAttribute("aria-label", w + (state.marks[i] ? "、印あり" : "") + (ev.targets.has(i) ? "、あと1マス" : ""));
    b.disabled = i === FREE;
  });
  $("n-bingo").textContent = ev.bingo;
  $("n-reach").textContent = ev.reach;
  $("n-marked").textContent = state.marks.filter(Boolean).length;
  $("pill-bingo").classList.toggle("hot", ev.bingo > 0);
  $("pill-reach").classList.toggle("hot", ev.reach > 0);
  $("rule-name").textContent = RULES[state.rule].name;
  $("btn-rule").setAttribute("aria-label", "ルール: " + RULES[state.rule].name + "。押すと説明と切り替え");
  $("btn-undo").disabled = state.history.length === 0;
  return ev;
}

function buzz(pattern) { try { if (navigator.vibrate) navigator.vibrate(pattern); } catch (e) {} }

let toastTimer;
function showToast(text, kind) {
  const t = $("toast");
  t.textContent = text;
  t.className = "toast show" + (kind === "info" ? " info" : "");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove("show"), kind === "info" ? 1400 : 1000);
}

// ---- 履歴（戻す）----
function pushHistory() {
  state.history.push({ card: state.card.slice(), marks: state.marks.slice() });
  if (state.history.length > HISTORY_MAX) state.history.splice(0, state.history.length - HISTORY_MAX);
}
let lastUndo = 0;
function undo() {
  const now = Date.now();
  if (now - lastUndo < 300 || !state.history.length || !$("overlay").hidden || !$("sheet").hidden) return;
  lastUndo = now;
  disarmNew();
  const prev = state.history.pop();
  const cardChanged = prev.card.join("\n") !== state.card.join("\n");
  const changed = cardChanged ? [] : prev.marks.map((m, i) => m !== state.marks[i] ? i : -1).filter(i => i >= 0);
  state.card = prev.card;
  state.marks = prev.marks;
  state.ackBingo = evaluate(state.marks).bingo; // 戻した結果ではオーバーレイを出さない
  render();
  saveState();
  if (cardChanged) showToast("前のカードに戻しました", "info");
  changed.forEach(i => { const c = cells[i]; c.classList.remove("undone"); void c.offsetWidth; c.classList.add("undone"); });
  buzz(25);
}
$("btn-undo").addEventListener("click", undo);

// ---- タップ ----
function toggle(i) {
  if (i === FREE || !$("overlay").hidden) return;
  disarmNew();
  const before = evaluate(state.marks);
  pushHistory();
  state.marks[i] = !state.marks[i];
  const after = render();
  if (!state.marks[i]) state.ackBingo = Math.min(state.ackBingo, after.bingo);
  if (after.bingo > state.ackBingo) {
    showOverlay(after.bingo);
  } else if (state.marks[i] && after.reach > before.reach && after.bingo === before.bingo) {
    showToast("リーチ!");
    buzz(60);
  } else {
    buzz(state.marks[i] ? 15 : [30, 40, 30]);
  }
  saveState();
}

// ---- 2回押しのボタン ----
function twoStep(btn, armedLabel, action, needConfirm = () => true) {
  const label = btn.textContent;
  let timer = null;
  const disarm = () => { clearTimeout(timer); timer = null; btn.classList.remove("armed"); btn.textContent = label; };
  btn.addEventListener("click", () => {
    if (timer || !needConfirm()) { disarm(); action(); return; }
    btn.classList.add("armed");
    btn.textContent = armedLabel;
    timer = setTimeout(disarm, 3000);
  });
  return disarm;
}

function newCard() {
  pushHistory();
  Object.assign(state, makeCard(state.words));
  state.ackBingo = 0;
  saveState();
  render();
}
const hasMarks = () => state.marks.some((m, i) => m && i !== FREE);
const disarmNew = twoStep($("btn-new"), "もう一度で作り直し", newCard, hasMarks);

// ---- オーバーレイ ----
let unlockTimer;
const ovButtons = [$("ov-continue"), $("ov-new")];
function showOverlay(n) {
  $("ov-title").textContent = n > 1 ? n + " BINGO!" : "BINGO!";
  $("ov-sub").textContent = n + "列そろいました";
  $("overlay").hidden = false;
  ovButtons.forEach(b => b.disabled = true);
  clearTimeout(unlockTimer);
  unlockTimer = setTimeout(() => { ovButtons.forEach(b => b.disabled = false); $("ov-continue").focus(); }, 800);
  buzz([80, 60, 160]);
}
function hideOverlay() { $("overlay").hidden = true; disarmOvNew(); }
$("ov-continue").addEventListener("click", () => {
  state.ackBingo = evaluate(state.marks).bingo;
  saveState();
  hideOverlay();
});
const disarmOvNew = twoStep($("ov-new"), "もう一度で作り直し", () => { newCard(); hideOverlay(); });

// ---- ルールのシート ----
function renderRules() {
  const r = RULES[state.rule];
  const list = $("rule-list");
  list.innerHTML = "";
  r.rows.forEach(([title, mk, text], i) => {
    const n = RULES.normal.rows[i];
    const li = document.createElement("li");
    const diff = state.rule !== "normal" && (n[1] !== mk || n[2] !== text);
    if (diff) li.className = "diff";
    const m = document.createElement("span");
    m.className = "mk " + mk;
    m.textContent = mk === "ok" ? "○" : "×";
    m.setAttribute("aria-label", mk === "ok" ? "OK" : "ダメ");
    const t = document.createElement("span");
    t.className = "t";
    const b = document.createElement("b");
    b.textContent = title;
    if (diff) { const em = document.createElement("em"); em.textContent = "ふつうと違う"; b.appendChild(em); }
    t.appendChild(b);
    t.appendChild(document.createTextNode(text));
    li.append(m, t);
    list.appendChild(li);
  });
  document.querySelectorAll(".seg button").forEach(btn => btn.setAttribute("aria-checked", String(btn.dataset.rule === state.rule)));
}
function openSheet() {
  disarmNew();
  renderRules();
  $("sheet").hidden = false;
  try { history.pushState({ sheet: true }, ""); } catch (e) {}
  document.querySelector('.seg button[aria-checked="true"]').focus();
}
function closeSheet(fromPop) {
  if ($("sheet").hidden) return;
  $("sheet").hidden = true;
  if (!fromPop && history.state && history.state.sheet) history.back();
  $("btn-rule").focus();
}
$("btn-rule").addEventListener("click", openSheet);
$("sheet-close").addEventListener("click", () => closeSheet(false));
$("sheet").addEventListener("click", e => { if (e.target === $("sheet")) closeSheet(false); });
window.addEventListener("popstate", () => closeSheet(true));
document.addEventListener("keydown", e => { if (e.key === "Escape") closeSheet(false); });
document.querySelectorAll(".seg button").forEach(btn => btn.addEventListener("click", () => {
  state.rule = btn.dataset.rule;
  saveState();
  renderRules();
  render();
}));

// ---- タブ ----
function showTab(name) {
  $("view-play").hidden = name !== "play";
  $("view-words").hidden = name !== "words";
  document.body.classList.toggle("playing", name === "play");
  $("tab-play").setAttribute("aria-selected", String(name === "play"));
  $("tab-words").setAttribute("aria-selected", String(name === "words"));
  if (name === "words") { disarmNew(); $("words").value = state.words; updateCount(); }
}
$("tab-play").addEventListener("click", () => showTab("play"));
$("tab-words").addEventListener("click", () => showTab("words"));

// ---- ことば ----
function updateCount() {
  const n = parseWords($("words").value).length;
  const c = $("word-count");
  c.textContent = n >= 24 ? n + " 個（OK）" : n + " 個（あと " + (24 - n) + " 個必要）";
  c.classList.toggle("bad", n < 24);
  $("btn-save-words").disabled = n < 24;
}
$("words").addEventListener("input", updateCount);
twoStep($("btn-reset-words"), "もう一度押すと戻します", () => { $("words").value = DEFAULT_WORDS; updateCount(); },
  () => !sameList(parseWords($("words").value), parseWords(DEFAULT_WORDS)));
twoStep($("btn-save-words"), "印が消えます。もう一度押す", () => {
  if (parseWords($("words").value).length < 24) return;
  state.words = $("words").value;
  newCard();
  showTab("play");
}, hasMarks);

// ---- 画面が消えないようにする（対応端末のみ）----
let wakeLock = null;
async function keepAwake() {
  try { if ("wakeLock" in navigator && !wakeLock) { wakeLock = await navigator.wakeLock.request("screen"); wakeLock.addEventListener("release", () => { wakeLock = null; }); } } catch (e) {}
}
document.addEventListener("pointerdown", keepAwake, { passive: true });
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") keepAwake(); });

// ---- オフライン用 ----
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => { navigator.serviceWorker.register("./sw.js").catch(() => {}); });
}

render();
</script>
</body>
</html>
